[project]
name = "clanki"
version = "0.1.0"
description = "Read lecture material and turn highlighted passages into Anki cards"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "platformdirs>=4.2",
    "python-multipart>=0.0.9",
    "openai>=3.33.0",
    "pypdf>=6.21.1",
    "keyring>=25.7.0",
    "readability-lxml>=0.9",
    "fpdf2>=2.8.9",
]

[project.scripts]
clanki = "clanki.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clanki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["soffice: needs LibreOffice installed", "live: calls real LLM APIs (costs money)"]
addopts = "-m 'not live'"
